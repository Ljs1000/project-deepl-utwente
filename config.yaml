data_dir: "data/chest_xray"
img_size: 150
batch_size: 32
num_workers: 2

classifier:
  epochs: 20
  lr: 1e-3
  weight_decay: 0.0

attack:
  epsilons: [0.0, 0.002, 0.005, 0.01, 0.02, 0.03]

vae:
  epochs: 20
  lr: 1e-3
  latent_dim: 64
  recon_loss: "mse"
  threshold_percentile: 95

pgd:
  alpha: 0.002
  steps: 10
  random_start: true
